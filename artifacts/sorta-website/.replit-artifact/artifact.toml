kind = "web"
previewPath = "/"
title = "Sorta — Next-Gen Recycling"
version = "1.0.0"
id = "artifacts/sorta-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21321

[services.development]
run = "pnpm --filter @workspace/sorta-website run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/sorta-website", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/sorta-website", "run", "serve"]

[services.production.run.env]
PORT = "21321"
NODE_ENV = "production"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "21321"
BASE_PATH = "/"
