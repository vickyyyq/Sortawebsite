kind = "web"
previewPath = "/"
title = "Sorta — Next-Gen Recycling"
version = "1.0.0"
id = "artifacts/sorta-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21321

[services.development]
run = "pnpm --filter @workspace/sorta-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sorta-website", "run", "build" ]
publicDir = "artifacts/sorta-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21321"
BASE_PATH = "/"
